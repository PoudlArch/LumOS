<?xml version="1.0" encoding="UTF-8"?>
<!-- LumOS, fond du menu de démarrage BIOS (640 x 480). Le menu occupe le centre et le bas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
<defs>
  <linearGradient id="g-ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0612"/>
    <stop offset=".5" stop-color="#170b1c"/>
    <stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <radialGradient id="g-lumiere">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".15" stop-color="#fff6c8" stop-opacity=".9"/>
    <stop offset=".45" stop-color="#ffd75e" stop-opacity=".3"/>
    <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="g-or" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff0b0"/>
    <stop offset=".5" stop-color="#d3a625"/>
    <stop offset="1" stop-color="#9a7212"/>
  </linearGradient>
</defs>

<rect width="640" height="480" fill="url(#g-ciel)"/>

<g id="etoiles" fill="#fff">
  <circle cx="42" cy="38" r="1.1" opacity=".7"/>
  <circle cx="96" cy="92" r=".8" opacity=".5"/>
  <circle cx="150" cy="30" r="1" opacity=".6"/>
  <circle cx="212" cy="118" r=".8" opacity=".45"/>
  <circle cx="470" cy="26" r="1.1" opacity=".7"/>
  <circle cx="520" cy="96" r=".9" opacity=".5"/>
  <circle cx="584" cy="52" r="1" opacity=".6"/>
  <circle cx="612" cy="130" r=".8" opacity=".45"/>
  <circle cx="30" cy="140" r=".8" opacity=".4"/>
  <circle cx="420" cy="124" r=".8" opacity=".45"/>
</g>

<g id="lumiere">
  <circle cx="320" cy="50" r="46" fill="url(#g-lumiere)"/>
  <path d="M320 22 Q322 48 348 50 Q322 52 320 78 Q318 52 292 50 Q318 48 320 22 Z" fill="#fffbe6"/>
</g>

<text x="320" y="118" text-anchor="middle" font-family="Liberation Serif, DejaVu Serif, serif" font-size="42" letter-spacing="7" fill="url(#g-or)">LumOS</text>
<path d="M214 134 H426" stroke="#d3a625" stroke-width="1" opacity=".6"/>
</svg>
