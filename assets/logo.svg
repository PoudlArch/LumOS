<?xml version="1.0" encoding="UTF-8"?>
<!-- LumOS, emblème : une baguette et sa lumière. Illustration originale. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <radialGradient id="g-nuit" cx=".62" cy=".3" r=".9">
    <stop offset="0" stop-color="#3a2a5c"/>
    <stop offset=".35" stop-color="#1c1436"/>
    <stop offset=".75" stop-color="#0c0a1a"/>
    <stop offset="1" stop-color="#05040b"/>
  </radialGradient>
  <linearGradient id="g-or" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff3b8"/>
    <stop offset=".25" stop-color="#d3a625"/>
    <stop offset=".5" stop-color="#8a6510"/>
    <stop offset=".75" stop-color="#e8c356"/>
    <stop offset="1" stop-color="#a87a14"/>
  </linearGradient>
  <linearGradient id="g-bois" gradientUnits="userSpaceOnUse" x1="150" y1="352" x2="168" y2="370">
    <stop offset="0" stop-color="#a8733f"/>
    <stop offset=".45" stop-color="#6b4220"/>
    <stop offset="1" stop-color="#2e1a0b"/>
  </linearGradient>
  <radialGradient id="g-lumiere">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".12" stop-color="#fff6c8" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#ffd75e" stop-opacity=".4"/>
    <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
  </radialGradient>
  <filter id="f-eclat" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-ombre" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <clipPath id="c-disque"><circle cx="256" cy="256" r="226"/></clipPath>
</defs>

<circle id="disque" cx="256" cy="256" r="226" fill="url(#g-nuit)"/>

<g id="etoiles" fill="#fff" clip-path="url(#c-disque)">
  <circle cx="112" cy="150" r="2.2" opacity=".8"/>
  <circle cx="150" cy="96" r="1.5" opacity=".6"/>
  <circle cx="210" cy="70" r="1.8" opacity=".7"/>
  <circle cx="92" cy="232" r="1.4" opacity=".5"/>
  <circle cx="176" cy="188" r="1.3" opacity=".6"/>
  <circle cx="404" cy="300" r="2" opacity=".7"/>
  <circle cx="432" cy="236" r="1.4" opacity=".5"/>
  <circle cx="372" cy="388" r="1.7" opacity=".6"/>
  <circle cx="300" cy="420" r="1.3" opacity=".5"/>
  <circle cx="246" cy="132" r="1.2" opacity=".5"/>
  <circle cx="420" cy="170" r="1.6" opacity=".6"/>
  <circle cx="128" cy="312" r="1.2" opacity=".45"/>
</g>

<g id="colline" clip-path="url(#c-disque)" fill="#07060f">
  <path d="M20 430 C110 390 190 420 262 404 C340 386 420 410 500 380 L500 500 L20 500 Z"/>
</g>

<g id="baguette" filter="url(#f-ombre)">
  <path d="M138 386 C134 380 136 372 142 366 L318 196 C322 192 328 198 324 202 L156 382 C150 388 142 390 138 386 Z" fill="url(#g-bois)"/>
  <path d="M146 368 L318 200" stroke="#d9a877" stroke-width="2" stroke-linecap="round" opacity=".5"/>
  <g id="baguette-poignee" fill="none" stroke="url(#g-or)" stroke-width="5" stroke-linecap="round">
    <path d="M168 342 L182 356"/>
    <path d="M182 328 L196 342"/>
  </g>
</g>

<g id="lumiere">
  <circle cx="330" cy="186" r="120" fill="url(#g-lumiere)"/>
  <path d="M330 106 Q336 180 410 186 Q336 192 330 266 Q324 192 250 186 Q324 180 330 106 Z" fill="#fffbe6" filter="url(#f-eclat)"/>
  <path d="M374 142 Q352 172 330 186 Q344 164 374 142 Z M286 230 Q308 200 330 186 Q316 208 286 230 Z M286 142 Q316 164 330 186 Q308 172 286 142 Z M374 230 Q344 208 330 186 Q352 200 374 230 Z" fill="#fff3c0" opacity=".8"/>
</g>

<circle id="anneau" cx="256" cy="256" r="226" fill="none" stroke="url(#g-or)" stroke-width="12"/>
<circle id="anneau-filet" cx="256" cy="256" r="212" fill="none" stroke="#d3a625" stroke-width="1.5" opacity=".5"/>
</svg>
